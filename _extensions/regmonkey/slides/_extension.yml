title: regmonkey revealjs slides
author: Ryo Nakagami
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [revealjs.scss]
      width: 1600
      height: 900
      navigationMode: linear
      slide-level: 2
      pdf-export: true
      chalkboard:
        button: true
      show-notes: separate-page
      transition: none
      background-transition: fade
      slide-number: true
      aspectratio: "16:9"
      menu: true
      toc: false
      footer: "[Regmonkey Presentation](/index.html). ©Ryo Nakagami. All rights reserved."
      font-family: "Meiryo"
      date-format: "YYYY年MM月DD日"
      code-line-numbers: true
      link-external-newwindow: true
      math: mathjax
      mathjax: "3"
      filters:
        - inject-regmonkey-js.lua
      revealjs-plugins:
        - leader-line
      header-includes: |
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/vuetify@3.8.10/dist/vuetify.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@3.5.10/dist/vue.global.prod.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vuetify@3.10.3/dist/vuetify.min.js"></script>
